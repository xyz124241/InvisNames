name: InvisNames
version: '${project.version}'
main: de.invisnames.InvisNames
api-version: '1.21'
description: Versteckt Namen von unsichtbaren Spielern (Nametag, Killmessage, Tabliste)
softdepend: [PlaceholderAPI, LuckPerms, DeluxeTags]
commands:
  invisnames:
    description: InvisNames verwalten
    usage: /invisnames reload
    permission: invisnames.admin
permissions:
  invisnames.admin:
    description: Darf /invisnames reload benutzen
    default: op
