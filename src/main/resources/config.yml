# ============================================================
#  InvisNames - Konfiguration
#  Gilt fuer jeden Spieler mit dem Traenke-Effekt "Unsichtbarkeit".
# ============================================================

# Name ueber dem Kopf (Nametag) verstecken
nametag:
  hide: true

# Kill-/Todesnachricht im Chat
kill-message:
  enabled: true
  # Womit der Name des unsichtbaren Killers ersetzt wird (MiniMessage-Format).
  # Beispiele:
  #   "-----"                                  -> 5 Bindestriche
  #   "<obfuscated>XXXXX</obfuscated>"         -> die springenden "Magic"-Zeichen (wie §k)
  #   "<gray><obfuscated>XXXXXXXX</obfuscated>" -> grau + springend
  replacement: "-----"
  # Soll auch der Name versteckt werden, wenn der UNSICHTBARE selbst stirbt?
  hide-victim-name: true

# Chat-Nachrichten, die der Unsichtbare selbst schreibt
chat:
  enabled: true
  # {message} = deine Nachricht. &-Farbcodes, &k = springende Zeichen.
  format: "&7----- &8» &f{message}"

# Join-/Quit-Nachricht ("X joined the game") fuer Unsichtbare unterdruecken
join-quit:
  hide-messages: true

# Erfolgs-Meldungen ("X has made the advancement ...") fuer Unsichtbare unterdruecken
advancements:
  hide-for-invisible: true

# Tabliste (TAB-Taste)
tab:
  enabled: true
  # HIDDEN      = du stehst gar nicht in der Tabliste
  # NAME_HIDDEN = du stehst drin, aber ohne Namen (nur Rang + Tag, schwarzer Kopf)
  mode: NAME_HIDDEN
  # Nur bei installiertem Plugin TAB: Text, der statt des Namens im Tab-Eintrag steht.
  # Leer lassen = Name komplett weg. Rang/Tag bleiben so, wie TAB sie anzeigt.
  name-replacement: ""
  # Was in der Tabliste statt des Namens steht (Ping wird vom Spiel selbst angezeigt).
  # Benutzt PlaceholderAPI-Platzhalter (PlaceholderAPI muss installiert sein) und &-Farbcodes.
  # %luckperms_prefix%  = Rang (LuckPerms)
  # %deluxetags_tag%    = aktiver DeluxeTags-Tag
  format: "%luckperms_prefix%&r %deluxetags_tag%"

# Schwarzer Kopf in der Tabliste (Skin-Textur).
# Hier muss einmalig ein Textur-Wert eingetragen werden - siehe README.md
black-skin:
  enabled: true
  value: ""
  signature: ""
